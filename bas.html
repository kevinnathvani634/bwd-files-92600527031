<!DOCTYPE html>
<html lang="en">
<head>
    <title>Different Shapes</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .shape {
            display: inline-block;
            margin: 30px;
        }

        .square {
            width: 100px;
            height: 100px;
            background: red;
        }

        .rectangle {
            width: 160px;
            height: 100px;
            background: blue;
        }

        .circle {
            width: 100px;
            height: 100px;
            background: green;
            border-radius: 50%;
        }

        
    </style>
</head>

<body>

<h1>Different Shapes</h1>

<div class="shape square"></div>

<div class="shape rectangle"></div>

<div class="shape circle"></div>

<div class="shape oval"></div>

<div class="shape triangle"></div>

</body>
</html>
