<!DOCTYPE html>
<html>
<head>
<style>
  table {
    border-collapse: collapse;
    width: 300px;
    height: 300px;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  td {
    border: 1px solid black;
    transition: background-color 0.3s ease;
  }
  td.red:hover { background-color: red; color: white; }
  td.blue:hover { background-color: blue; color: white; }
  td.green:hover { background-color: green; color: white; }
  td.yellow:hover { background-color: yellow; color: black; }
  td.orange:hover { background-color: orange; color: black; }
  td.purple:hover { background-color: purple; color: white; }
  td.pink:hover { background-color: pink; color: black; }
  td.cyan:hover { background-color: cyan; color: black; }
  td.brown:hover { background-color: brown; color: white; }
  
</style>
</head>
<body>

<table>
  <tr>
    <td class="red">Red</td>
    <td class="blue">Blue</td>
    <td class="green">Green</td>
  </tr>
  <tr>
    <td class="yellow">Yellow</td>
    <td class="orange">Orange</td>
    <td class="purple">Purple</td>
  </tr>
  <tr>
    <td class="pink">Pink</td>
    <td class="cyan">Cyan</td>
    <td class="brown">Brown</td>
  </tr>
</table>

</body>
</html>
