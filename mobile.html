<!DOCTYPE html>
<html>
<head>
    <style>
        /* Base styling for both boxes */
        .box {
            position: absolute; /* REQUIRED: z-index only works on positioned elements */
            width: 150px;
            height: 150px;
            color: white;
            padding: 10px;
            font-family: sans-serif;
        }

        /* Red box stays at the bottom because its z-index is 1 */
        .red-box {
            background-color: red;
            top: 50px;
            left: 50px;
            z-index: 1; 
        }

        /* Blue box stays on top because its z-index (2) is higher than 1 */
        .blue-box {
            background-color: blue;
            top: 100px;
            left: 100px;
            z-index: 2; 
        }
    </style>
</head>
<body>


    <!-- Even though Blue is written first in HTML, it stays on top due to its z-index -->
    <div class="box blue-box">Blue Box (z-index: 2)</div>
    <div class="box red-box">Red Box (z-index: 1)</div>

</body>
</html>
